name: release rust sdk

# Publishes the Rust SDK, crates.io `jiayang`, with no stored token.
#
# crates.io trusted publishing matches this file by NAME, so the config over there says
# `release-crates.yml`. Renaming or moving it stops publishing until that config is changed to
# match. It also pins the owner's numeric GitHub id, so renaming the account means recreating it.
#
# crates.io rejects the `workflow_run` and `pull_request_target` triggers outright, so unlike the
# private repository's deploy.yml this cannot be chained off another workflow. A tag push is the
# trigger, and there is no workflow_dispatch: the `release` environment is restricted to tags
# matching sdk-rust-v*, and a dispatch run carries a branch ref, which can never match a tag rule.
# To retry, re-run this run from the Actions tab. That keeps the tag ref, and the guard in
# `publish` makes a re-run after a successful publish fail before any token exists.
#
# Nothing here checks this commit. The tree is assembled and tested by `make mirror-check` in the
# private repository, which runs `cargo publish --dry-run` against this same manifest on every PR.
# Cut a tag only from a mirror push whose private run was green.

on:
  push:
    tags: ["sdk-rust-v[0-9]+.[0-9]+.[0-9]+", "sdk-rust-v[0-9]+.[0-9]+.[0-9]+-*"]

permissions: {}

concurrency:
  group: release-crates
  cancel-in-progress: false

jobs:
  # Two jobs, and only the second can mint anything. GitHub hands the OIDC capability to every step
  # of a job that has id-token: write, not just the one that asks, so whatever that job compiles
  # could trade it for a crates.io token. Packaging builds the crate to verify it, which runs every
  # `build.rs` in its dependency tree, so it happens here, where there is nothing to trade.
  verify:
    if: github.repository == 'ss2d22/jiayang'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "1.92.0"

      # No dependency cache here, deliberately. A run on a tag can restore a cache written by the
      # default branch, and this job builds what the release is checked against. The release
      # compiles once; a cache would save a few minutes and widen what has to be trusted.

      # `cargo metadata --no-deps` resolves nothing and does not write Cargo.lock, so it cannot
      # dirty the tree `cargo package` is about to check.
      - id: version
        name: check the tag matches the version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          manifest=$(cargo metadata --no-deps --format-version 1 \
            --manifest-path sdks/rust/Cargo.toml \
            | jq -r '.packages[] | select(.name == "jiayang") | .version')
          want=${REF_NAME#sdk-rust-v}
          [ "$want" = "$manifest" ] || {
            echo "::error::tag asks for jiayang $want, sdks/rust/Cargo.toml says $manifest"
            exit 1
          }
          echo "version=$manifest" >> "$GITHUB_OUTPUT"

      # --all-features because the default build never touches the optional axum integration, and
      # that is the half most likely to fail to compile out of the tarball.
      - run: cargo package -p jiayang --locked --all-features

  # Compiles nothing: `cargo publish --no-verify` packages the commit `verify` built and uploads
  # it, so no build script and no dependency's code runs beside the token.
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # crates.io only sees an `environment` claim because this is here. The config over there
    # requires `release`, so removing this line fails the exchange rather than publishing.
    environment:
      name: release
      url: https://crates.io/crates/jiayang
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "1.92.0"

      # Here rather than in `verify`, because re-running a failed publish from the Actions tab
      # re-runs this job alone. A version on crates.io can never be replaced, so catching a
      # duplicate now beats failing at the upload with a token already minted.
      - name: check the version is free
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "User-Agent: jiayang-release (https://github.com/${GITHUB_REPOSITORY})" \
            "https://crates.io/api/v1/crates/jiayang/$VERSION")
          case "$code" in
            404) ;;
            200) echo "::error::jiayang $VERSION is already published; versions are permanent"; exit 1 ;;
            *)   echo "::error::crates.io answered $code for jiayang $VERSION"; exit 1 ;;
          esac
          echo "publishing jiayang $VERSION"

      # Trades this job's OIDC identity for a crates.io token good for 30 minutes. The action's
      # post step revokes it when the job ends, so a leaked token outlives the job by nothing.
      - id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - run: cargo publish -p jiayang --locked --all-features --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
