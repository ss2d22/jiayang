[project]
name = "jiayang"
version = "0.1.0"
description = "Verify who is calling your Jiayang Cloud app."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "The Jiayang Cloud Authors" }]
keywords = ["jiayang", "identity", "jwt", "auth"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = ["PyJWT[crypto]>=2.10.1,<3"]

# Each integration only needs its own framework, and nothing else comes with it. The extras are
# here so `pip install jiayang[fastapi]` says what it needs, and fails at install rather than at
# the first request.
[project.optional-dependencies]
flask = ["Flask>=3"]
fastapi = ["fastapi>=0.115"]
django = ["Django>=4.2"]
streamlit = ["streamlit>=1.37"]
gradio = ["gradio>=5"]

[dependency-groups]
dev = [
    "Flask>=3",
    "fastapi>=0.115",
    "httpx2>=2",
    "Django>=4.2",
]
# [build-system]'s requirement again, so that uv.lock pins the build backend and everything it
# needs by hash. release-python.yml builds with this group as its build constraints and
# --require-hashes, so a release is built with exactly the tools the checks before it used.
# scripts/release.test.mjs fails if the two lists differ.
build = ["hatchling>=1.27"]

[project.urls]
Homepage = "https://jiayang.cloud"
Documentation = "https://jiayang.cloud/docs/sdks/python/"
Source = "https://github.com/ss2d22/jiayang/tree/main/sdks/python"
Changelog = "https://github.com/ss2d22/jiayang/blob/main/sdks/python/CHANGELOG.md"
Issues = "https://github.com/ss2d22/jiayang/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jiayang"]
